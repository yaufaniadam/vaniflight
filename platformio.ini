[platformio]
src_dir = flying_wing_fc
default_envs = pico

; ============================================================================
; 1. RASPBERRY PI PICO (RP2040 - Rp 25rb)
; ============================================================================
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; ============================================================================
; 2. STM32F411 / STM32F405 (BlackPill & Generic F405)
; ============================================================================
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
monitor_speed = 115200

[env:stm32f405]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
upload_protocol = dfu
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
monitor_speed = 115200

; ============================================================================
; 3. ESP32 DEVKIT (Rp 65rb)
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ============================================================================
; 4. TEENSY 4.0 / 4.1
; ============================================================================
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
